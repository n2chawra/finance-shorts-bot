# Routines run in cloud sessions that may push branches but may not create GitHub Releases.
# A routine pushes a branch media/<id> (main plus video.mp4 at the root, or video.mp4.part-NNN
# parts when it is over GitHub's 100 MB file limit); this workflow turns
# that into Release video-<id> and deletes the branch, so the repo does not keep video files.
name: Release video

on:
  push:
    branches: ["media/**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create the release and remove the media branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id="${BRANCH#media/}"
          tag="video-$id"
          # a video over 100 MB comes in parts (video.mp4.part-000, -001, ...): join them in order
          if [ ! -s video.mp4 ] && ls video.mp4.part-* >/dev/null 2>&1; then
            cat $(ls video.mp4.part-* | sort) > video.mp4
            echo "joined $(ls video.mp4.part-* | wc -l) parts into video.mp4 ($(stat -c %s video.mp4) bytes)"
          fi
          test -s video.mp4 || { echo "::error::video.mp4 is missing or empty on $BRANCH"; exit 1; }

          # title from the manifest on main; fall back to the id if it is not there yet
          title="$(gh api "repos/$GITHUB_REPOSITORY/contents/videos/$id/manifest.json?ref=main" --jq .content 2>/dev/null | base64 -d 2>/dev/null | jq -r '.title // empty' 2>/dev/null || true)"
          [ -n "$title" ] || title="Video $id"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" video.mp4 --clobber
          else
            gh release create "$tag" video.mp4 --target main --title "$title" --notes "Video $id"
          fi
          # name the file after the video (owner, 2026-10-31: downloads were all "video (16).mp4"):
          # GitHub signs the asset's own name into its download link, so the name lives on the asset
          slug="$(printf '%s' "$title" | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-80 | sed -E 's/-+$//')"
          [ -n "$slug" ] || slug="$id"
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name == "video.mp4") | .id' | head -1)"
          [ -z "$asset_id" ] || gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -f name="$slug.mp4" --silent
          git push origin --delete "$BRANCH"
          echo "Released $tag: $title" >> "$GITHUB_STEP_SUMMARY"
