# BRANCH-ONLY end-to-end test of twins.yml (deleted before shipping). Twins (owner, 2026-11-13): the most-watched animated Shorts on our topics, watched by Gemini into shot
# sheets, so the writer learns how winners tell a topic before writing it, and every published Short
# gets a gap report against its twins (workers/twins.ts). Runs after research (23:47 IST) and before
# the 04:07 video run. Our own analysis goes to main (improvement/twins/); YouTube titles and views go
# to the market-data branch (replaced daily) and the dashboard.
name: Twins test (branch only)

on:
  push:
    branches: [claude/fervent-clarke-q7cx4o]
    paths: [.github/workflows/twins-test.yml]

permissions:
  contents: write

concurrency:
  group: twins-test

jobs:
  twins:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: workers
      - run: npm run generate
        working-directory: workers
      - name: Calibrate on our own Shorts
        working-directory: workers
        run: npm run twins -- calibrate | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Night
        working-directory: workers
        run: npm run twins -- night "$RUNNER_TEMP/twins-data" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep twins.json for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twins-data
          path: ${{ runner.temp }}/twins-data
          if-no-files-found: ignore
      - name: Commit the shot sheets, briefs and gap reports
        if: always()
        run: |
          git add improvement/twins
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Twins test: shot sheets, briefs and gap reports (branch only)"
          git push -q origin HEAD:claude/fervent-clarke-q7cx4o
