# Daily YouTube Analytics numbers per uploaded video into VideoStat; also marks videos published.
name: Stats

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 h (08:47 IST, …): Analytics publishes each day's numbers at an unpredictable hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Stats
        run: npm run stats | tee -a "$GITHUB_STEP_SUMMARY"
