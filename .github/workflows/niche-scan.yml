# Niche scan for a channel being set up (multi-channel plan, step 3a; workers/niche-scan.ts).
# Started by the dashboard's "Add channel" (and by the /new-channel skill), never on a schedule.
#   aggregates + ids  -> channels/<slug>/research/scan.json on main (kept)
#   titles + numbers  -> <slug>.json on the `niche-data` branch, one commit with no history, rewritten on
#                        every scan; files older than 30 days are dropped (YouTube API data is never kept
#                        past its refresh). Read with `git show origin/niche-data:<slug>.json`.
name: Niche scan

on:
  # monthly re-research (multi-channel plan, step 4): every live channel's niche again on the 1st, so the
  # families and the challenger list follow shifts in what the niche watches
  schedule:
    - cron: "17 4 1 * *"   # 09:47 IST on the 1st
  workflow_dispatch:
    inputs:
      slug:
        description: "Channel slug (channels/<slug>/); empty scans every live channel"
        required: false

permissions:
  contents: write

concurrency:
  group: niche-scan

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      # without an API key the scan reads with channel #1's stored sign-in
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_WEB_CLIENT_ID: ${{ secrets.YT_WEB_CLIENT_ID }}
      YT_WEB_CLIENT_SECRET: ${{ secrets.YT_WEB_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      SLUG: ${{ inputs.slug || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Which channels
        run: |
          if [ -n "$SLUG" ]; then slugs="$SLUG"
          else slugs=$(python3 -c "import json,os;c=json.load(open('config/channels.json'))['channels'];print(' '.join(k for k,v in c.items() if v['status'] in ('active','paused') and os.path.exists(f'channels/{k}/research/scan-request.json')))")
          fi
          for s in $slugs; do echo "$s" | grep -Eq '^[a-z0-9][a-z0-9-]{1,40}$' || { echo "::error::bad slug $s"; exit 1; }; done
          echo "SLUGS=$slugs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
        working-directory: workers
      - run: npm run generate
        working-directory: workers
      - name: Earlier scans on the niche-data branch (kept up to 30 days)
        run: |
          mkdir -p "$RUNNER_TEMP/niche-data"
          if git fetch -q origin niche-data; then
            for f in $(git ls-tree --name-only origin/niche-data); do
              git show "origin/niche-data:$f" > "$RUNNER_TEMP/niche-data/$f"
            done
          fi
          # the file's own scannedAt decides its age (checkout times are all "now")
          node -e '
            const fs=require("fs"),p=process.argv[1];
            for (const f of fs.readdirSync(p)) { try { const j=JSON.parse(fs.readFileSync(p+"/"+f,"utf8"));
              if (Date.now()-Date.parse(j.scannedAt) > 30*864e5) fs.unlinkSync(p+"/"+f); } catch { fs.unlinkSync(p+"/"+f); } }' "$RUNNER_TEMP/niche-data"
      - name: Scan
        working-directory: workers
        shell: bash
        run: for s in $SLUGS; do npm run niche-scan -- "$s" "$RUNNER_TEMP/niche-data" | tee -a "$GITHUB_STEP_SUMMARY"; done
      - name: Commit the aggregates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for s in $SLUGS; do for f in "channels/$s/research/scan.json" "channels/$s/research/scan-request.json" "channels/$s/setup.json"; do [ ! -e "$f" ] || git add "$f"; done; done
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Niche scan: $SLUGS"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Replace the niche-data branch
        run: |
          cd "$RUNNER_TEMP/niche-data"
          ls *.json >/dev/null 2>&1 || { echo "nothing to publish"; exit 0; }
          git init -q -b niche-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -q -m "Niche scans $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" niche-data
