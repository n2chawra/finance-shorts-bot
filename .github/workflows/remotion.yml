# Typecheck and test the Remotion project (remotion/) whenever it changes: the timeline contract,
# the scenes, the formatter's parity with Python and the story clock.
name: remotion

on:
  push:
    paths: ["remotion/**", "renderer/timeline/**", "renderer/models/**", ".github/workflows/remotion.yml"]
  pull_request:
    paths: ["remotion/**", "renderer/timeline/**", "renderer/models/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04   # pinned 2026-11-03: ubuntu-latest became 26.04, which Playwright 1.56 cannot install on
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
