# Uploads today's videos to YouTube (private + publishAt), each slot only when it is within
# UPLOAD_LOOKAHEAD_HOURS (workers/lib/publishing.ts). Default Short slots (IST): 07:07 at the 03:07
# run, 12:37 at 10:07, 19:07 and long 20:07 at 16:07; trend slots 16:07 at 13:07 and 22:07 at 19:37.
# A slot missed by a late run is caught up within 2 h (public ~15 min after the run); "Run workflow"
# with upload_now uploads that many queued Shorts at once.
# Filling late lets a trending video made at midday take an evening slot.
# GitHub drops scheduled runs under load, not only delays them: on 12 Nov 2026 every run after
# 09:16 IST was dropped (the 19:07 Short and an "Upload now" waited for a run that never came).
# So the job runs every 20 minutes, at odd minutes away from the busy hour marks. A run with
# nothing due only checks the database and stops (no YouTube quota); the repo is public, so the
# minutes are free. With ~70 chances a day, one dropped run costs 20 minutes, not a slot.
# Two triggers that don't depend on GitHub's scheduler back it up: every finished Ingest, and the
# dashboard's Netlify function (apps/dashboard/netlify/functions/publish-heartbeat.mts), which
# dispatches this workflow whenever it hasn't started for 15 minutes, and at once on "Upload now".
name: Publish

on:
  schedule:
    - cron: "11,31,51 * * * *"
  # right after Ingest: the morning routine's new Shorts get their slots the moment they land
  workflow_run:
    workflows: ["Ingest"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upload_now:
        description: "Upload this many queued Shorts now (public ~15 min later, 5 min apart); 0 = only fill slots"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-24.04   # pinned 2026-11-03: ubuntu-latest became 26.04, which Playwright 1.56 cannot install on
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      UPLOAD_NOW: ${{ inputs.upload_now || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Publish
        shell: bash   # bash -eo pipefail: a failing job turns red instead of hiding behind tee
        run: npm run publish | tee -a "$GITHUB_STEP_SUMMARY"
