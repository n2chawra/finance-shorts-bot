# Uploads today's videos to YouTube (private + publishAt), each slot only when it is within
# UPLOAD_LOOKAHEAD_HOURS (workers/lib/publishing.ts). Default Short slots (IST): 07:07 at the 03:07
# run, 12:37 at 10:07, 19:07 and long 20:07 at 16:07; trend slots 16:07 at 13:07 and 22:07 at 19:37.
# Filling late lets a trending video made at midday take an evening slot. Each slot gets a retry
# run; GitHub can start a cron job up to ~3 h late, so every slot has a run comfortably before it.
name: Publish

on:
  schedule:
    - cron: "37 21 * * *"     # 03:07 IST: the 07:07 slot
    - cron: "7 23 * * *"      # 04:37 IST: retry for it
    - cron: "37 4,7,10 * * *" # 10:07, 13:07, 16:07 IST
    - cron: "7 12 * * *"      # 17:37 IST: retry for the evening slots
    - cron: "7 14 * * *"      # 19:37 IST: the 22:07 trend slot
    - cron: "37 15 * * *"     # 21:07 IST: retry for it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Publish
        shell: bash   # bash -eo pipefail: a failing job turns red instead of hiding behind tee
        run: npm run publish | tee -a "$GITHUB_STEP_SUMMARY"
