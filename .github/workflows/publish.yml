# Uploads today's videos to YouTube (private + publishAt), each slot only when it is within
# UPLOAD_LOOKAHEAD_HOURS (workers/lib/publishing.ts): 12:37 at the 10:07 run, 19:07 at 16:07, and
# long videos' 20:07 at 16:07. Filling late lets a trending video made at midday take the evening
# slot. Each slot gets a retry run (13:07 for 12:37, 17:37 for the evening ones).
name: Publish

on:
  schedule:
    - cron: "37 4,7,10 * * *" # 10:07, 13:07, 16:07 IST
    - cron: "7 12 * * *"      # 17:37 IST: retry for the evening slots
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Publish
        run: npm run publish | tee -a "$GITHUB_STEP_SUMMARY"
