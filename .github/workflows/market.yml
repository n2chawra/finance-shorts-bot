# What's working in each channel's niche this week (top Shorts and long videos for channels/<slug>/market.json's
# searches) and what viewers say under its videos, for the research (23:47) and Scout (09:37) agents. Published
# on the `market-data` branch as one commit with no history, replaced twice a week: YouTube API data is
# never kept past its refresh. Agents read it with `git show origin/market-data:<slug>/market.json`.
# A channel the day's searches can't cover keeps last run's folder (workers/market.ts, PREV_MARKET_DIR).
name: Market

on:
  schedule:
    - cron: "47 16 * * 1,4" # 22:17 IST Mon and Thu (was daily; searches cost 100 units each, quota 2026-11-18)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market

jobs:
  market:
    runs-on: ubuntu-24.04   # pinned 2026-11-03: ubuntu-latest became 26.04, which Playwright 1.56 cannot install on
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # the default channel's sealed sign-in (connected from the dashboard) and the web client that refreshes it
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      YT_WEB_CLIENT_ID: ${{ secrets.YT_WEB_CLIENT_ID }}
      YT_WEB_CLIENT_SECRET: ${{ secrets.YT_WEB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
        working-directory: workers
      - run: npm run generate
        working-directory: workers
      - name: Last run's data (thumbnail references carry over for a week; a channel not scanned keeps its folder)
        run: |
          # only files that exist: an empty one (from `> file` when the branch has none) crashed the search until 2026-11-11
          mkdir -p "$RUNNER_TEMP/prev-market"
          if git fetch -q origin market-data; then git archive origin/market-data | tar -x -C "$RUNNER_TEMP/prev-market"; fi
      - name: Market and comments
        working-directory: workers
        env:
          PREV_MARKET_DIR: ${{ runner.temp }}/prev-market
        shell: bash   # bash -eo pipefail: a failing job turns red instead of hiding behind tee
        run: npm run market -- "$RUNNER_TEMP/market-data" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replace the market-data branch
        run: |
          [ -f "$RUNNER_TEMP/market-data/index.json" ] || { echo "nothing written"; exit 0; }
          cd "$RUNNER_TEMP/market-data"
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Market data $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data
