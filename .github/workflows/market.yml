# What's working in the niche this week (top Shorts and long videos for config/market.json's searches)
# and what viewers say under our videos, for the research (23:47) and Scout (09:37) agents. Published
# on the `market-data` branch as one commit with no history, replaced daily: YouTube API data is
# never kept past its refresh. Agents read it with `git show origin/market-data:market.json`.
name: Market

on:
  schedule:
    - cron: "47 16 * * *" # 22:17 IST, before the research agent
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
        working-directory: workers
      - run: npm run generate
        working-directory: workers
      - name: Market and comments
        working-directory: workers
        run: npm run market -- "$RUNNER_TEMP/market-data" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replace the market-data branch
        run: |
          [ -f "$RUNNER_TEMP/market-data/market.json" ] || { echo "nothing written"; exit 0; }
          cd "$RUNNER_TEMP/market-data"
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json comments.json
          git commit -q -m "Market data $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data
