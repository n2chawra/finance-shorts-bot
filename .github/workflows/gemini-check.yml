# One-off, branch only: checks the Gemini key can watch a public YouTube Short. Deleted before anything ships.
name: Gemini check
on:
  push:
    branches: [claude/fervent-clarke-q7cx4o]
    paths: [.github/workflows/gemini-check.yml, scripts/gemini_check.py]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gemini_check.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
