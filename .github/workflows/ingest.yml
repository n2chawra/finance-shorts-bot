# New manifests → Postgres, and database settings → config/settings.json (which routines read).
# Runs on every push that adds a video, a failed video or a template run (so the dashboard shows it
# within a minute), right after a video's release is created, and four times a day to sync settings.
# Its own settings commit does not re-trigger it: pushes made with the workflow token never do.
name: Ingest

on:
  push:
    branches: [main]
    paths:
      - "videos/**"
      - "history/**"
      - "renderer/templates/**"
      - "workers/ingest.ts"
      - "apps/dashboard/prisma/**"
      - "improvement/**"
  workflow_run:
    workflows: ["Release video", "Stats"]
    types: [completed]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check secrets
        run: |
          [ -n "$DATABASE_URL" ] && [ -n "$DIRECT_URL" ] || { echo "::error::Set the DATABASE_URL and DIRECT_URL repository secrets"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Apply migrations
        run: npm run migrate
      - name: Ingest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run ingest | tee "$GITHUB_STEP_SUMMARY"
      - name: Commit settings and metrics for routines and agents
        working-directory: .
        run: |
          git add config/settings.json metrics
          if git diff --cached --quiet; then echo "settings unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync settings, backlog and metrics from the database"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
