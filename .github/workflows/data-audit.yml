# Nightly data audit, 22:30 IST, half an hour before the auditor agent: compares what the dashboard
# shows with YouTube and the database (workers/data-audit.ts), commits metrics/data-audit.json for
# the agent, and raises owner notifications for what only the owner can fix.
name: Data audit

on:
  schedule:
    - cron: "0 17 * * *" # 22:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            workers/package-lock.json
            apps/dashboard/package-lock.json
      - name: Install the workers and the dashboard's data code
        run: |
          (cd workers && npm ci && npm run generate)
          (cd apps/dashboard && npm ci)
      - name: Audit
        working-directory: workers
        run: npm run data-audit | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the report for the auditor agent
        run: |
          git add metrics/data-audit.json
          if git diff --cached --quiet; then echo "report unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Data audit $(date -u +%F)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
