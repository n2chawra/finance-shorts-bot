# Dashboard deploy. Live at https://courageous-granita-bb8b51.netlify.app
[build]
  base = "apps/dashboard"
  command = "npm run build"
  publish = ".next"
  # Routines and ingest push several commits a day that never touch the dashboard. Skip those builds
  # (exit 0 = skip) so they don't use up the free build minutes. Runs from the base directory.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# The repo root has no Next.js dependency, so Netlify's auto-detection misses it; declare the runtime.
[[plugins]]
  package = "@netlify/plugin-nextjs"
